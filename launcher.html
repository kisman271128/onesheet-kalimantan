<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>MAP - Kalimantan</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f0f4ff;
           display: flex; align-items: center; justify-content: center; height: 100vh; }
    .box { text-align: center; background: white; border-radius: 16px;
           padding: 40px 50px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 360px; }
    .logo { font-size: 48px; margin-bottom: 10px; }
    h2 { margin: 0 0 6px; color: #334155; font-size: 18px; }
    p  { margin: 0 0 20px; color: #64748b; font-size: 13px; }
    .bar-wrap { background: #e2e8f0; border-radius: 20px; height: 8px; overflow: hidden; margin-bottom: 12px; }
    .bar { height: 8px; border-radius: 20px; background: linear-gradient(90deg,#667eea,#764ba2);
           width: 0%; transition: width 0.4s; }
    .status { font-size: 12px; color: #64748b; min-height: 18px; }
  </style>
</head>
<body>
<div class="box">
  <div class="logo">📊</div>
  <h2>MAP - Monthly Account Plan</h2>
  <p>Region Kalimantan</p>
  <div class="bar-wrap"><div class="bar" id="bar"></div></div>
  <div class="status" id="status">Memuat aplikasi...</div>
</div>

<script>
  const RAW_URL   = 'https://raw.githubusercontent.com/kisman271128/onesheet-kalimantan/master/index.html';
  const LOCAL_URL = 'index.html';
  const CACHE_KEY      = 'map_index_html';
  const CACHE_TIME_KEY = 'map_index_time';
  const CACHE_TTL      = 60 * 60 * 1000; // 1 jam

  const bar    = document.getElementById('bar');
  const status = document.getElementById('status');

  function setBar(pct) { bar.style.width = pct + '%'; }
  function setStatus(msg) { status.textContent = msg; }

  function renderHTML(html) {
    document.open();
    document.write(html);
    document.close();
  }

  const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);

  async function loadApp() {

    // ── LOCALHOST: langsung pakai index.html lokal ─────────────────────────
    if (isLocal) {
      setBar(40);
      setStatus('Mode lokal — memuat index.html...');
      try {
        const res = await fetch(LOCAL_URL + '?t=' + Date.now());
        if (!res.ok) throw new Error('index.html tidak ditemukan');
        setBar(90);
        const html = await res.text();
        setBar(100);
        renderHTML(html);
      } catch(e) {
        setStatus('❌ ' + e.message);
      }
      return;
    }

    // ── ONLINE: fetch dari GitHub, cache 1 jam ─────────────────────────────
    const cached     = localStorage.getItem(CACHE_KEY);
    const cachedTime = parseInt(localStorage.getItem(CACHE_TIME_KEY) || '0');
    const now        = Date.now();

    if (cached && (now - cachedTime) < CACHE_TTL) {
      setBar(80);
      setStatus('Memuat dari cache...');
      setTimeout(() => { setBar(100); renderHTML(cached); }, 200);
      return;
    }

    setBar(20);
    setStatus('Mengunduh versi terbaru dari server...');

    try {
      const controller = new AbortController();
      const timeout    = setTimeout(() => controller.abort(), 10000);
      const res        = await fetch(RAW_URL + '?t=' + now, { signal: controller.signal });
      clearTimeout(timeout);
      if (!res.ok) throw new Error('HTTP ' + res.status);

      setBar(70);
      setStatus('Memproses...');
      const html = await res.text();

      try {
        localStorage.setItem(CACHE_KEY, html);
        localStorage.setItem(CACHE_TIME_KEY, String(now));
      } catch(e) { /* storage penuh */ }

      setBar(100);
      setTimeout(() => renderHTML(html), 150);

    } catch(err) {
      if (cached) {
        setBar(80);
        setStatus('⚠️ Offline — menggunakan versi tersimpan');
        setTimeout(() => renderHTML(cached), 800);
      } else {
        setBar(50);
        setStatus('⚠️ Tidak ada koneksi, mencoba lokal...');
        setTimeout(() => { location.href = LOCAL_URL; }, 1500);
      }
    }
  }

  loadApp();
</script>
</body>
</html>
